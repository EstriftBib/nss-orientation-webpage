<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSS NIT Silchar — UG 2026–2030</title>
  <style>
    :root {
      --bg: #001030;
      --button-bg: rgba(255, 255, 255, 0.16);
      --button-hover: rgba(255, 255, 255, 0.28);
      --dot: rgba(255, 255, 255, 0.45);
      --dot-active: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .carousel {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateX(8%);
      transition:
        transform 420ms cubic-bezier(.22,.61,.36,1),
        opacity 320ms ease,
        visibility 0s linear 420ms;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      transition:
        transform 420ms cubic-bezier(.22,.61,.36,1),
        opacity 320ms ease,
        visibility 0s;
      pointer-events: auto;
    }

    .slide.prev {
      transform: translateX(-8%);
    }

    .slide img {
      display: block;
      max-width: 100vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 16px 50px rgba(0, 0, 0, .35);
    }

    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      background: var(--button-bg);
      color: #fff;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      z-index: 10;
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background .2s, transform .2s;
    }

    .nav:hover {
      background: var(--button-hover);
    }

    .nav:active {
      transform: translateY(-50%) scale(.94);
    }

    .nav.left { left: 22px; }
    .nav.right { right: 22px; }

    .dots {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 9px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--dot);
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .dot.active {
      background: var(--dot-active);
      transform: scale(1.45);
    }

    .counter {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 10;
      font-size: 13px;
      letter-spacing: .08em;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    @media (max-width: 700px) {
      .carousel,
      .viewport {
        width: 100vw;
        height: 100dvh;
      }

      .slide img {
        width: 100vw;
        max-width: 100vw;
        max-height: 100dvh;
        object-fit: contain;
        box-shadow: none;
      }

      .nav {
        width: 44px;
        height: 44px;
        font-size: 28px;
        background: rgba(0,0,0,.22);
      }

      .nav.left { left: 10px; }
      .nav.right { right: 10px; }

      .dots {
        bottom: max(14px, env(safe-area-inset-bottom));
      }

      .counter {
        top: 12px;
        right: 12px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide,
      .slide.active {
        transition: opacity 150ms ease;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="carousel" aria-label="NSS NIT Silchar information slideshow">
    <div class="viewport" id="viewport">
      <figure class="slide active">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653201/panel1_uakzha.jpg" alt="NSS NIT Silchar welcome poster for UG 2026–2030 batch">
      </figure>

      <figure class="slide">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel4_lmy6vm.jpg" alt="NSS NIT Silchar about us, motto and major activities">
      </figure>

      <figure class="slide">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel6_iede51.jpg" alt="NSS benefits and common questions and answers">
      </figure>

      <figure class="slide">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653231/panel5_euwjxf.jpg" alt="NSS NIT Silchar event gallery">
      </figure>

      <figure class="slide">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653230/panel3_puvzen.jpg" alt="NSS orientation and recruitment process">
      </figure>

      <figure class="slide">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel2_cvw1fs.jpg" alt="NSS NIT Silchar contact details and social media">
      </figure>
      
      <figure class="slide">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787664130/image_aktfyd.jpg" alt="NSS Brochure for UG 2026–2030 batch">
      </figure>
    </div>

    <button class="nav left" id="prev" aria-label="Previous slide" title="Previous slide">&#10094;</button>
    <button class="nav right" id="next" aria-label="Next slide" title="Next slide">&#10095;</button>

    <div class="counter" id="counter" aria-live="polite">1 / 6</div>

    <nav class="dots" aria-label="Slide navigation">
      <button class="dot active" aria-label="Go to slide 1"></button>
      <button class="dot" aria-label="Go to slide 2"></button>
      <button class="dot" aria-label="Go to slide 3"></button>
      <button class="dot" aria-label="Go to slide 4"></button>
      <button class="dot" aria-label="Go to slide 5"></button>
      <button class="dot" aria-label="Go to slide 6"></button>
    </nav>
  </main>

  <script>
    (() => {
      const slides = [...document.querySelectorAll(".slide")];
      const dots = [...document.querySelectorAll(".dot")];
      const prevButton = document.getElementById("prev");
      const nextButton = document.getElementById("next");
      const viewport = document.getElementById("viewport");
      const counter = document.getElementById("counter");

      let current = 0;
      let touchStartX = 0;
      let touchStartY = 0;
      let isAnimating = false;

      function update(nextIndex, direction = 1) {
        if (isAnimating || nextIndex === current) return;

        isAnimating = true;

        const oldIndex = current;
        current = (nextIndex + slides.length) % slides.length;

        slides.forEach((slide, index) => {
          slide.classList.remove("active", "prev");

          if (index === current) {
            slide.style.transform =
              direction > 0 ? "translateX(8%)" : "translateX(-8%)";
          }
        });

        requestAnimationFrame(() => {
          slides[oldIndex].classList.remove("active");
          slides[current].classList.add("active");
          slides[current].style.transform = "translateX(0)";

          dots.forEach((dot, index) => {
            dot.classList.toggle("active", index === current);
            dot.setAttribute("aria-current", index === current ? "true" : "false");
          });

          counter.textContent = `${current + 1} / ${slides.length}`;
        });

        setTimeout(() => {
          slides.forEach((slide, index) => {
            if (index !== current) slide.style.transform = "";
          });
          isAnimating = false;
        }, 440);
      }

      function goNext() {
        update(current + 1, 1);
      }

      function goPrev() {
        update(current - 1, -1);
      }

      nextButton.addEventListener("click", goNext);
      prevButton.addEventListener("click", goPrev);

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => {
          if (index !== current) {
            const direction = index > current ? 1 : -1;
            update(index, direction);
          }
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          event.preventDefault();
          goNext();
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          goPrev();
        } else if (event.key === "Home") {
          event.preventDefault();
          update(0, -1);
        } else if (event.key === "End") {
          event.preventDefault();
          update(slides.length - 1, 1);
        }
      });

      viewport.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      viewport.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;

        // Ignore mostly vertical gestures.
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;

        if (dx < 0) goNext();
        else goPrev();
      }, { passive: true });

      // Optional: clicking the image itself advances forward on desktop.
      viewport.addEventListener("click", (event) => {
        if (event.target.tagName !== "IMG") return;
        if (window.matchMedia("(max-width: 700px)").matches) return;
        goNext();
      });

      // Prevent accidental browser image dragging.
      document.querySelectorAll("img").forEach(img => {
        img.draggable = false;
      });
    })();
  </script>
</body>
</html>
